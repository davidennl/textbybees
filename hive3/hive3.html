<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Text 3</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>
</head>
<body>

    <div class="terug-wrapper">
        <a href="../index.html">
            <div class= "terug">
                <img src="../images/terug.png" alt="back button">

            <div class= "terug-hover">

    <!-- Previous Button -->

                </div>
                <div class="back">
                    <div id="b1" class="back-content">
                        <img class="cover-img" src="../images/SLT02.jpg" alt="cover">

                </div>
            </div>

                </div>
            </div>

                </div>
            </div>
                    <!-- Paper 4 -->

        </div>

        <!-- Next Button -->
        <button id="next-btn">
            <img src="../images/arrow-right.png" class="fas fa-arrow-circle-right">
        </button>

    <div class="mobile-overlay">
        Please access the archive on a larger screen.
    </div>

</html>
