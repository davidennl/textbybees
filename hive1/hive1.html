<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bee Text 1</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./main.js" defer></script>
</head>
<body>

    <div class="terug-wrapper">
        <a href="../index.html">
            <div class= "terug">
                <img src="../images/terug.png" alt="back button">
            </div>
            <div class= "terug-hover">
                <img src="../images/terughover.png" alt="back button hover">
            </div>
        </a>
    </div>
    

    <div class="book-container">
        <!-- Previous Button -->
        <button id="prev-btn">
            <img src="../images/arrow-left.png" class="fas fa-arrow-circle-left">
        </button>

        <!-- Book -->
        <div id="book" class="book">
            <!-- Paper 1 -->
            <div id="p1" class="paper">
                <div class="front">
                    <div id="f1" class="front-content">
                    <img class="cover-img" src="../images/PPE20.jpg" alt="cover">
                    </div>
                </div>
                <div class="back">
                    <div id="b1" class="back-content">
                        <img class="cover-img" src="../images/PPE21.jpg" alt="cover">
                    </div>
                </div>
            </div>
            <!-- Paper 2 -->
            <div id="p2" class="paper">
                <div class="front">
                    <div id="f2" class="front-content">
                        <img class="cover-img" src="../images/PPE22.jpg" alt="cover">
                    </div>
                </div>
                <div class="back">
                    <div id="b2" class="back-content">
                        <img class="cover-img" src="../images/PPE23.jpg" alt="cover">
                    </div>
                </div>
            </div>
            <!-- Paper 3 -->
            <div id="p3" class="paper">
                <div class="front">
                    <div id="f3" class="front-content">
                        <img class="cover-img" src="../images/PPE24.jpg" alt="cover">
                    </div>
                </div>
                <div class="back">
                    <div id="b3" class="back-content">
                        <img class="cover-img" src="../images/PPE25.jpg" alt="cover">
                    </div>
                </div>
            </div><!-- Paper 4 -->
            <div id="p4" class="paper">
                <div class="front">
                    <div id="f4" class="front-content">
                        <img class="cover-img" src="../images/PPE26.jpg" alt="cover">
                    </div>
                </div>
                <div class="back">
                    <div id="b4" class="back-content">
                        <img class="cover-img" src="../images/PPE20.jpg" alt="cover">
                    </div>
                </div>
            </div>
        </div>

        <!-- Next Button -->
        <button id="next-btn">
            <img src="../images/arrow-right.png" class="fas fa-arrow-circle-right">
        </button>
    </div>
    <div class="mobile-overlay">
        Please access the archive on a larger screen.
    </div>

</body>
</html>
